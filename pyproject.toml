[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-intake-ai"
version = "1.0.0"
description = "Supplier invoice extraction with the Claude API, deterministic checks and human approval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Giuseppe P." }]
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pypdf>=4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]

[project.scripts]
invoice-intake = "invoice_intake.api:main"
invoice-intake-demo = "invoice_intake.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_intake"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
